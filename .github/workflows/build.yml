# Builds the app on GitHub's servers, so you don't need Android Studio.
# Every push to main produces a new release with DailyCode.apk attached:
#   https://github.com/<you>/<repo>/releases/latest
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk DailyCode.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" DailyCode.apk \
            --target "${{ github.sha }}" \
            --title "Daily Code (build ${{ github.run_number }})" \
            --notes "Open this page on your Pixel and tap **DailyCode.apk** to download and install it." \
            --latest

      # Smoke-tests the free online code runner the app uses to check answers.
      - name: Check online code runner
        if: always()
        continue-on-error: true
        run: |
          curl -sSfL -o "$RUNNER_TEMP/json.jar" https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          javac -d "$RUNNER_TEMP/rc" -cp "$RUNNER_TEMP/json.jar" \
            app/src/main/java/com/dailycode/app/Runner.java tools/RunnerCheck.java
          set -o pipefail
          java -cp "$RUNNER_TEMP/rc:$RUNNER_TEMP/json.jar" RunnerCheck app/src/main/assets/questions.json 2>&1 | tee runner-check.txt

      # Keeps the latest APK and build log on the build-output branch (handy for debugging).
      - name: Save build output
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp build.log DailyCode.apk runner-check.txt "$RUNNER_TEMP/out/" 2>/dev/null || true
          printf 'status: %s\ncommit: %s\nrun: %s\n' "${{ job.status }}" "${{ github.sha }}" "${{ github.run_number }}" > "$RUNNER_TEMP/out/status.txt"
          cd "$RUNNER_TEMP/out"
          git init -q -b build-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build output for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output
